name: Build GDAL Wheels

# Version selection (first match wins):
#   1. tag push        v3.13.3            -> 3.13.3
#   2. manual run      input gdal_version -> that version
#   3. everything else DEFAULT_GDAL_VERSION below
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      gdal_version:
        description: 'GDAL version X.Y.Z (must exist on PyPI and in GitHub releases). Empty = default.'
        required: false
        type: string

# A new push cancels the superseded PR run; branch/tag runs are never cancelled.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DEFAULT_GDAL_VERSION: '3.13.3'
  PROJ_VERSION: '9.9.0'                 # only used for the Linux/macOS source build
  CIBUILDWHEEL_VERSION: '3.4.1'
  # Pull requests get a fast signal (one Python); main / tags / manual runs build everything.
  CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp312-*' || 'cp310-* cp311-* cp312-* cp313-* cp314-*' }}
  CIBW_SKIP: '*-win32 *_i686 *-musllinux_* pp*'
  CIBW_BUILD_VERBOSITY: '1'

jobs:
  # ══════════════════════════════════════════════════════════════════
  #  1. Resolve the version and fetch the Python-bindings sdist ONCE.
  #     The PyPI sdist ships pre-generated SWIG wrappers, so no cmake /
  #     SWIG / full GDAL configure is needed to build the bindings.
  # ══════════════════════════════════════════════════════════════════
  prepare:
    name: Fetch GDAL sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gdal_version: ${{ steps.ver.outputs.gdal_version }}
    steps:
      - name: Resolve GDAL version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.gdal_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then v="$INPUT_VERSION"
          else v="$DEFAULT_GDAL_VERSION"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid GDAL version '$v' (expected X.Y.Z)"; exit 1; }
          echo "gdal_version=$v" >> "$GITHUB_OUTPUT"
          echo "Building GDAL $v"

      - name: Download sdist from PyPI (checksum verified)
        env:
          GDAL_VERSION: ${{ steps.ver.outputs.gdal_version }}
        run: |
          set -euo pipefail
          meta="$(curl -fsSL --retry 3 "https://pypi.org/pypi/gdal/${GDAL_VERSION}/json")"
          url="$(jq -r '[.urls[] | select(.packagetype=="sdist")][0].url' <<<"$meta")"
          sha="$(jq -r '[.urls[] | select(.packagetype=="sdist")][0].digests.sha256' <<<"$meta")"
          curl -fsSL --retry 3 -o gdal-sdist.tar.gz "$url"
          echo "$sha  gdal-sdist.tar.gz" | sha256sum -c -

      - uses: actions/upload-artifact@v4
        with:
          name: gdal-sdist
          path: gdal-sdist.tar.gz
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════
  #  2. Linux (manylinux_2_28, x86_64)
  #     One cibuildwheel run for ALL Python versions, so PROJ + libgdal
  #     are compiled once (BEFORE_ALL), not once per Python version.
  # ══════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux · manylinux_2_28
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gdal-sdist

      - name: Prepare source tree
        run: |
          python ci/prepare_sdist.py gdal-sdist.tar.gz gdal-src \
            --gdal-config /opt/gdal/bin/gdal-config \
            --copy ci/build-libgdal.sh --copy ci/smoke_test.py

      - run: python -m pip install "cibuildwheel==${CIBUILDWHEEL_VERSION}"

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse gdal-src
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # Runs once inside the container; /project is the copied gdal-src directory.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y sqlite sqlite-devel &&
            /opt/python/cp312-cp312/bin/python -m pip install cmake ninja &&
            PATH=/opt/python/cp312-cp312/bin:$PATH
            bash /project/build-libgdal.sh /opt/gdal
            ${{ needs.prepare.outputs.gdal_version }} ${{ env.PROJ_VERSION }}
          # build-time only: lets the linker resolve libgdal's own dependency (libproj)
          CIBW_ENVIRONMENT_LINUX: LDFLAGS="-Wl,-rpath-link,/opt/gdal/lib"
          # LD_LIBRARY_PATH is scoped to the repair step so the tests prove the wheel is self-contained
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            LD_LIBRARY_PATH=/opt/gdal/lib:$LD_LIBRARY_PATH
            auditwheel repair -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python {project}/smoke_test.py ${{ needs.prepare.outputs.gdal_version }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════
  #  3. macOS (arm64 + x86_64)
  #     libgdal/PROJ prefix is cached, so only the first run (or a
  #     version/script change) pays for the compile.
  # ══════════════════════════════════════════════════════════════════
  build-macos:
    name: macOS · ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  runner: macos-15,       target: '11.0' }
          - { arch: x86_64, runner: macos-15-intel, target: '10.15' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gdal-sdist

      - name: Cache libgdal + PROJ
        id: libgdal
        uses: actions/cache@v4
        with:
          path: ~/gdal-prefix
          key: libgdal-macos-${{ matrix.arch }}-t${{ matrix.target }}-gdal${{ needs.prepare.outputs.gdal_version }}-proj${{ env.PROJ_VERSION }}-${{ hashFiles('ci/build-libgdal.sh') }}

      - name: Build libgdal + PROJ
        if: steps.libgdal.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
        run: |
          python -m pip install cmake ninja
          bash ci/build-libgdal.sh "$HOME/gdal-prefix" \
            "${{ needs.prepare.outputs.gdal_version }}" "$PROJ_VERSION"

      - name: Prepare source tree
        run: |
          python ci/prepare_sdist.py gdal-sdist.tar.gz gdal-src \
            --gdal-config "$HOME/gdal-prefix/bin/gdal-config" \
            --copy ci/smoke_test.py

      - run: python -m pip install "cibuildwheel==${CIBUILDWHEEL_VERSION}"

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse gdal-src
        env:
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=${{ matrix.target }}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            DYLD_LIBRARY_PATH=$HOME/gdal-prefix/lib
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
          CIBW_TEST_COMMAND: python {project}/smoke_test.py ${{ needs.prepare.outputs.gdal_version }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════
  #  4. Windows (x86_64)
  #     libgdal comes prebuilt from conda-forge (seconds, not a vcpkg
  #     compile). Paths go into setup.cfg, so there is no
  #     CIBW_ENVIRONMENT to mis-quote (the original "Malformed
  #     environment option" error).
  # ══════════════════════════════════════════════════════════════════
  build-windows:
    name: Windows · x86_64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gdal-sdist

      - name: Cache conda package downloads
        uses: actions/cache@v4
        with:
          path: C:\mamba-root\pkgs
          key: mamba-pkgs-win-gdal${{ needs.prepare.outputs.gdal_version }}

      - name: Install libgdal from conda-forge
        shell: pwsh
        run: |
          $mm = Join-Path $env:RUNNER_TEMP 'micromamba.exe'
          Invoke-WebRequest -Uri 'https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-win-64' -OutFile $mm
          & $mm create -y -r C:\mamba-root -p C:\gdal-env -c conda-forge --override-channels "libgdal-core=${{ needs.prepare.outputs.gdal_version }}"
          if ($LASTEXITCODE -ne 0) { throw "micromamba create failed" }
          # fail early if the layout is not what the build expects
          Get-Item C:\gdal-env\Library\include\gdal.h, C:\gdal-env\Library\lib\gdal.lib, C:\gdal-env\Library\bin\gdal.dll | Out-Null

      - name: Prepare source tree
        shell: pwsh
        run: |
          python ci/prepare_sdist.py gdal-sdist.tar.gz gdal-src `
            --include-dir C:/gdal-env/Library/include `
            --library-dir C:/gdal-env/Library/lib `
            --copy ci/smoke_test.py

      - name: Install cibuildwheel
        shell: pwsh
        run: python -m pip install "cibuildwheel==$env:CIBUILDWHEEL_VERSION"

      - name: Build wheels
        shell: pwsh
        run: cibuildwheel --output-dir wheelhouse gdal-src
        env:
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path C:\gdal-env\Library\bin -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python {project}/smoke_test.py ${{ needs.prepare.outputs.gdal_version }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════
  #  5. Publish on tag push
  # ══════════════════════════════════════════════════════════════════
  release:
    name: Publish Release
    needs: [prepare, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: GDAL ${{ needs.prepare.outputs.gdal_version }} wheels
