name: Build GDAL Wheels

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gdal_version:
        description: 'GDAL version (e.g. 3.9.3)'
        required: false
        default: '3.9.3'

env:
  GDAL_VERSION: ${{ github.event.inputs.gdal_version || '3.9.3' }}

# ════════════════════════════════════════════════════════════════════
#  Linux  –  manylinux_2_28
#  流程：cmake 生成 setup.py + extensions/*.cpp → cibuildwheel 打包
# ════════════════════════════════════════════════════════════════════
jobs:
  build-linux:
    name: "Linux · ${{ matrix.python }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp39, cp310, cp311, cp312]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      - name: Fetch GDAL source into workspace
        run: |
          curl -L "https://github.com/OSGeo/gdal/releases/download/v${GDAL_VERSION}/gdal-${GDAL_VERSION}.tar.gz" \
            -o /tmp/gdal-src.tar.gz
          tar -xzf /tmp/gdal-src.tar.gz -C $GITHUB_WORKSPACE
          echo "GDAL_SRC=$GITHUB_WORKSPACE/gdal-${GDAL_VERSION}" >> $GITHUB_ENV

      - name: Build
        env:
          CIBW_BUILD: "${{ matrix.python }}-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
          # BEFORE_ALL 在容器內執行：
          # 1. 裝系統依賴 2. cmake 生成 setup.py + extensions/*.cpp
          CIBW_BEFORE_ALL_LINUX: |
            dnf install -y epel-release
            dnf install -y \
              gdal-devel proj-devel geos-devel \
              sqlite-devel libcurl-devel \
              hdf5-devel netcdf-devel \
              postgresql-devel \
              cmake make gcc gcc-c++ swig
            GDAL_SRC=/project/gdal-${GDAL_VERSION}
            mkdir -p /tmp/gdal-build
            cmake -S "$GDAL_SRC" -B /tmp/gdal-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_PYTHON_BINDINGS=ON \
              -DGDAL_PYTHON_INSTALL_PREFIX=/tmp/gdal-install \
              -DGDAL_USE_HDF5=OFF \
              -DGDAL_USE_NETCDF=OFF
            cmake --build /tmp/gdal-build --target python_generated_files -j$(nproc)
            # 把生成的 setup.py 和 extensions/ 複製到 swig/python
            cp /tmp/gdal-build/swig/python/setup.py "$GDAL_SRC/swig/python/"
            cp -r /tmp/gdal-build/swig/python/extensions "$GDAL_SRC/swig/python/"
          CIBW_BEFORE_BUILD: pip install numpy setuptools wheel
          CIBW_ENVIRONMENT: >
            GDAL_CONFIG=/usr/bin/gdal-config
            GDAL_VERSION=${{ env.GDAL_VERSION }}
          CIBW_REPAIR_WHEEL_COMMAND: >
            auditwheel repair
              --plat manylinux_2_28_x86_64
              -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: >
            python -c "from osgeo import gdal; print('GDAL OK:', gdal.__version__)"
        run: cibuildwheel --output-dir wheelhouse ${{ env.GDAL_SRC }}/swig/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python }}
          path: wheelhouse/*.whl

# ════════════════════════════════════════════════════════════════════
#  macOS  –  arm64 + x86_64
#  流程：cmake 生成 setup.py + extensions/*.cpp → cibuildwheel 打包
# ════════════════════════════════════════════════════════════════════
  build-macos:
    name: "macOS · ${{ matrix.python }} · ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: cp311, arch: arm64,  runner: macos-15 }
          - { python: cp312, arch: arm64,  runner: macos-15 }
          - { python: cp311, arch: x86_64, runner: macos-15-intel }
          - { python: cp312, arch: x86_64, runner: macos-15-intel }

    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ matrix.runner }}-gdal-${{ env.GDAL_VERSION }}
          restore-keys: brew-${{ matrix.runner }}-gdal-

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install gdal proj geos hdf5 netcdf swig cmake

      - name: Fetch GDAL source & cmake generate
        run: |
          curl -L "https://github.com/OSGeo/gdal/releases/download/v${GDAL_VERSION}/gdal-${GDAL_VERSION}.tar.gz" \
            -o /tmp/gdal-src.tar.gz
          tar -xzf /tmp/gdal-src.tar.gz -C $GITHUB_WORKSPACE
          GDAL_SRC=$GITHUB_WORKSPACE/gdal-${GDAL_VERSION}
          mkdir -p /tmp/gdal-build
          cmake -S "$GDAL_SRC" -B /tmp/gdal-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DGDAL_PYTHON_INSTALL_PREFIX=/tmp/gdal-install
          cmake --build /tmp/gdal-build --target python_generated_files -j$(sysctl -n hw.logicalcpu)
          cp /tmp/gdal-build/swig/python/setup.py "$GDAL_SRC/swig/python/"
          cp -r /tmp/gdal-build/swig/python/extensions "$GDAL_SRC/swig/python/"
          echo "GDAL_SRC=$GDAL_SRC" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      - name: Build
        env:
          CIBW_BUILD: "${{ matrix.python }}-macosx_*"
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_BEFORE_BUILD: pip install numpy setuptools wheel
          CIBW_ENVIRONMENT_MACOS: >
            GDAL_CONFIG=$(brew --prefix gdal)/bin/gdal-config
            GDAL_VERSION=${{ env.GDAL_VERSION }}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel
              --require-archs {delocate_archs}
              -w {dest_dir} -v {wheel}
          CIBW_TEST_COMMAND: >
            python -c "from osgeo import gdal; print('GDAL OK:', gdal.__version__)"
        run: cibuildwheel --output-dir wheelhouse ${{ env.GDAL_SRC }}/swig/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

# ════════════════════════════════════════════════════════════════════
#  Windows  –  x86_64 via vcpkg
# ════════════════════════════════════════════════════════════════════
  build-windows:
    name: "Windows · ${{ matrix.python }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp39, cp310, cp311, cp312]

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-gdal-${{ runner.os }}-${{ env.GDAL_VERSION }}
          restore-keys: vcpkg-gdal-${{ runner.os }}-

      - name: Install GDAL via vcpkg
        run: |
          if (-not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          choco install swig -y
          C:\vcpkg\vcpkg install gdal:x64-windows
        shell: pwsh

      - name: Fetch GDAL source & cmake generate
        run: |
          $url = "https://github.com/OSGeo/gdal/releases/download/v$env:GDAL_VERSION/gdal-$env:GDAL_VERSION.tar.gz"
          Invoke-WebRequest $url -OutFile "$env:TEMP\gdal-src.tar.gz"
          tar -xzf "$env:TEMP\gdal-src.tar.gz" -C "$env:GITHUB_WORKSPACE"
          $GDAL_SRC = "$env:GITHUB_WORKSPACE\gdal-$env:GDAL_VERSION"
          cmake -S "$GDAL_SRC" -B "$env:TEMP\gdal-build" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_PYTHON_BINDINGS=ON `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build "$env:TEMP\gdal-build" --target python_generated_files
          Copy-Item "$env:TEMP\gdal-build\swig\python\setup.py" "$GDAL_SRC\swig\python\"
          Copy-Item "$env:TEMP\gdal-build\swig\python\extensions" "$GDAL_SRC\swig\python\" -Recurse -Force
          echo "GDAL_SRC=$GDAL_SRC" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      - name: Build
        env:
          CIBW_BUILD: "${{ matrix.python }}-win_amd64"
          CIBW_BEFORE_BUILD: "pip install numpy setuptools wheel delvewheel"
          CIBW_ENVIRONMENT_WINDOWS: >
            GDAL_HOME=C:\vcpkg\installed\x64-windows
            PROJ_DIR=C:\vcpkg\installed\x64-windows
            INCLUDE=C:\vcpkg\installed\x64-windows\include
            LIB=C:\vcpkg\installed\x64-windows\lib
            PATH=C:\vcpkg\installed\x64-windows\bin;$PATH
            GDAL_VERSION=${{ env.GDAL_VERSION }}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            delvewheel repair
              --add-path C:\vcpkg\installed\x64-windows\bin
              -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: >
            python -c "from osgeo import gdal; print('GDAL OK:', gdal.__version__)"
        run: cibuildwheel --output-dir wheelhouse ${{ env.GDAL_SRC }}\swig\python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}
          path: wheelhouse/*.whl

# ════════════════════════════════════════════════════════════════════
#  Release  –  推 tag 時自動發佈
# ════════════════════════════════════════════════════════════════════
  release:
    name: "Publish Release"
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Show collected wheels
        run: ls -lh dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
          name: "GDAL ${{ env.GDAL_VERSION }} wheels"
